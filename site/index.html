<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChampCalc</title>
<meta name="description" content="Every mathematically possible path to every FBS conference championship game, plus College Football Playoff odds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one scrolling column. conference tabs, school picker, scoreboard header, top-5 paths, tree, builder, standings; CFP tab swaps the body */
  color-scheme:dark;
  --brand:#a51d24; --brand-hi:#d4424a; --accent:#dcb65f; --on-brand:#f4ecd9;
  --cream:#f4ecd9; --muted:#bdb1a6;
  --bg:color-mix(in srgb,var(--brand) 9%,#0d0b0b);
  --panel:color-mix(in srgb,var(--brand) 13%,#181515);
  --panel-2:color-mix(in srgb,var(--brand) 20%,#1e1a1a);
  --line:color-mix(in srgb,var(--brand-hi) 30%,#2c2828);
  --ok:#56c283; --warn:#ecc44c; --bad:#f06464;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cream);font:400 16px/1.5 var(--body);transition:background-color .5s;
  background-image:radial-gradient(900px 440px at 50% -120px,color-mix(in srgb,var(--brand) 55%,transparent),transparent 70%)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* logos */
.logo{position:relative;display:inline-grid;place-items:center;border-radius:50%;background:#f6f1e6;flex:none;width:var(--sz,40px);height:var(--sz,40px);
  box-shadow:0 0 0 2px var(--lb,var(--brand-hi))}
.logo img{width:78%;height:78%;object-fit:contain;display:block}
.logo b{display:none;font:700 calc(var(--sz,40px)*.3)/1 var(--display);letter-spacing:.03em;color:var(--lo,#fff)}
.logo.nologo{background:var(--lb,var(--brand))}
.logo.nologo img{display:none}.logo.nologo b{display:block}

/* picker */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand-hi)}
.tab.cfp{border-color:var(--accent);color:var(--accent)}
.tab.cfp[aria-pressed="true"]{color:var(--on-brand)}
.picker{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding-top:10px}
.chip{display:grid;justify-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 2px 6px;cursor:pointer;transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--panel-2);box-shadow:inset 0 -3px 0 var(--accent)}
.chip span{font:600 13px/1 var(--display);letter-spacing:.08em}
.chip small{font-size:11.5px;color:var(--muted);line-height:1}
.chip.dead{opacity:.62}.chip.dead small{color:var(--bad)}

/* header */
header.top{padding:22px 0 0}
.hero{display:flex;gap:16px;align-items:center}
.hero .logo{--sz:92px}
.herologo{position:relative;flex:none}
.eyebrow{font:600 13px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,6vw,48px);line-height:1.02;text-transform:uppercase;margin-top:8px}
h1 span{color:var(--brand-hi)}
.lede{color:var(--muted);max-width:66ch;margin:12px 0 0}
.badge{display:inline-flex;align-items:center;gap:8px;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;
  padding:7px 11px;border-radius:4px;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand-hi)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.yard{height:14px;margin:22px 0 0;border-top:2px solid var(--accent);border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(244,236,217,.28) 18px 19px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font:700 clamp(26px,6vw,38px)/1 var(--display);color:var(--accent)}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
.wins{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wins div{flex:1 1 150px;background:var(--panel-2);border-left:3px solid var(--brand-hi);border-radius:4px;padding:8px 10px;font-size:14px}
.wins small{display:block;color:var(--muted);font:600 11px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase}
.quote{font:600 clamp(20px,4.4vw,28px)/1.2 var(--display);color:var(--cream);margin:14px 0 0;max-width:30ch;text-wrap:balance}

/* stamp */
.stamp{position:absolute;left:50%;top:50%;translate:-50% -50%;transform:rotate(-14deg);white-space:nowrap;pointer-events:none;
  font:700 calc(var(--sz,92px)*.2)/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:#e0262b;
  border:calc(var(--sz,92px)*.03) double #e0262b;border-radius:calc(var(--sz,92px)*.04);padding:.28em .5em .22em;background:rgba(255,255,255,.72);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 0 55%,rgba(0,0,0,.75) 56% 100%),repeating-linear-gradient(115deg,#000 0 7px,rgba(0,0,0,.82) 7px 9px);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  text-shadow:0 0 1px #e0262b}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;cursor:pointer}
.ov-bg{position:absolute;inset:0;background:rgba(6,4,4,.86);backdrop-filter:blur(3px)}
.ov-logo{position:relative;--sz:min(62vw,300px)}
.ov-logo .logo{box-shadow:0 0 0 6px var(--brand-hi),0 30px 80px rgba(0,0,0,.6)}
.ov-q{position:relative;margin:0;text-align:center;font:600 clamp(20px,5vw,30px)/1.2 var(--display);max-width:24ch;text-wrap:balance;color:#f4ecd9}

section{margin-top:40px}
h2{font-size:26px;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font:500 14px/1.3 var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--tone)}
.t-ok{--tone:var(--ok)} .t-warn{--tone:var(--warn)} .t-bad{--tone:var(--bad)} .t-info{--tone:var(--accent)}

/* top paths */
.paths{display:grid;gap:10px;margin-top:12px}
.path{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.path .rk{font:700 34px/1 var(--display);color:var(--accent);min-width:28px}
.path h3{font-size:20px;text-transform:uppercase;line-height:1.15}
.path p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.path .pr{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.path .pr b{color:var(--accent);font:700 17px/1 var(--display)}
.must{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.must span{font-size:12.5px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.must span i{color:var(--muted);font-style:normal}

/* tree */
.node{position:relative}
.node>button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tone);border-radius:8px;padding:12px;transition:background .2s,border-color .2s}
.node>button:hover{background:var(--panel-2);border-color:var(--tone)}
.node>button[aria-expanded="true"]{background:var(--panel-2)}
.node.leaf>button{cursor:default}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);
  background:color-mix(in srgb,var(--tone) 18%,transparent);color:var(--tone);border:1px solid var(--tone);margin-top:1px}
.nt{font:600 19px/1.15 var(--display);letter-spacing:.02em;text-transform:uppercase}
.ns{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:4px}
.chev{font-size:13px;color:var(--muted);transition:transform .3s;margin-top:4px}
button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.meter{display:block;margin-top:9px}
.meter em{display:block;height:6px;border-radius:3px;background:rgba(244,236,217,.1);overflow:hidden}
.meter em b{display:block;height:100%;background:var(--tone);border-radius:3px}
.meter span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border-radius:3px;
  color:var(--tone);border:1px solid var(--tone);margin-left:8px;vertical-align:2px;white-space:nowrap}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden;min-height:0}
.kids{position:relative;margin:0 0 0 13px;padding:12px 0 2px 18px;display:grid;gap:10px}
.kids::before{content:"";position:absolute;left:0;top:0;bottom:14px;width:2px;
  background:repeating-linear-gradient(180deg,var(--accent) 0 6px,transparent 6px 14px);background-size:2px 14px;animation:flow 1s linear infinite;opacity:.7}
.kids>.node::before{content:"";position:absolute;left:-18px;top:24px;width:16px;height:2px;background:var(--accent);opacity:.55}
@keyframes flow{to{background-position:0 14px}}
.detail{background:rgba(0,0,0,.22);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px}
.detail p{margin:0 0 8px}.detail p:last-child{margin-bottom:0}
.rows{display:grid;gap:5px;margin-top:8px}
.rows div{display:grid;grid-template-columns:minmax(92px,auto) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.rows em{height:6px;border-radius:3px;background:rgba(244,236,217,.1);overflow:hidden;display:block}
.rows em b{display:block;height:100%;background:var(--tone,var(--accent))}
[data-tip]{position:relative;border-bottom:1px dotted var(--accent);cursor:help}
[data-tip]:hover::after,[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:5;width:min(270px,72vw);
  background:#0c0808;border:1px solid var(--accent);border-radius:6px;padding:8px 10px;font:400 13px/1.4 var(--body);color:var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:600 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.empty{background:var(--panel);border:1px dashed var(--bad);border-radius:8px;padding:16px;color:var(--muted)}

/* builder */
.builder{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.games{display:grid;gap:6px}
.grp{font:600 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:10px 0 2px}
.game{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}
.game button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 8px;cursor:pointer;font:600 15px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;min-height:40px;transition:background .15s,border-color .15s}
.game button:hover{border-color:var(--accent)}
.game button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand-hi)}
.game button small{display:block;font:500 11px/1.2 var(--body);letter-spacing:0;opacity:.7;text-transform:none}
.game .at{color:var(--muted);font-size:12px}
.game .dt{color:var(--muted);font-size:12px;width:44px;text-align:right}
.verdict{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tone,var(--accent));border-radius:8px;padding:14px}
.verdict h3{font-size:24px;text-transform:uppercase;color:var(--tone,var(--accent))}
.verdict p{margin:6px 0 0;font-size:14.5px}
.verdict ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.stand{margin-top:10px;display:grid;gap:3px;font-size:14px}
.stand div{display:flex;justify-content:space-between;padding:3px 8px;border-radius:4px}
.stand .in{background:rgba(86,194,131,.16);color:var(--ok);font-weight:600}
.stand .me{outline:1px solid var(--brand-hi)}

/* standings */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;background:var(--panel)}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel)}
tr.sel td{background:var(--panel-2)}
td.tm{display:flex;gap:9px;align-items:center;font-weight:600}
td .logo{--sz:28px}
td.r,th.r{text-align:right}
.guide{display:grid;gap:6px;margin-top:12px}
.guide div{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;font-size:14px}
.guide .bar{position:relative;height:18px;border-radius:3px;background:rgba(244,236,217,.08)}
.guide .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:3px;opacity:.8}
.guide .bar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.guide .bar span{position:absolute;right:5px;top:0;font:600 12px/18px var(--body);text-shadow:0 1px 2px #000}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 14px}
summary{cursor:pointer;font:600 20px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em;padding:13px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details ol{margin:0;padding:0 0 14px 22px}
details li{margin:6px 0}
details li b{color:var(--accent)}
.note{background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 45%,transparent),color-mix(in srgb,var(--brand) 10%,transparent));border:1px solid var(--brand-hi);border-radius:8px;padding:16px}
.note h3{font-size:24px;text-transform:uppercase;color:var(--accent)}
.note p{margin:8px 0 0;max-width:70ch}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer p{margin:6px 0;max-width:80ch}
[hidden]{display:none!important}
@media (max-width:760px){
  .picker{grid-template-columns:repeat(5,1fr)}
  .chip span{font-size:12px}
  .hero{gap:12px}.hero .logo{--sz:68px}
  .builder{grid-template-columns:1fr}.verdict{position:static;order:-1}
  .tiles{grid-template-columns:1fr}.tile{display:grid;grid-template-columns:minmax(86px,auto) 1fr;gap:12px;align-items:center}.tile span{margin:0}
  .kids{margin-left:6px;padding-left:14px}.kids>.node::before{left:-14px;width:12px}
  .node>button{gap:9px;padding:11px 10px}.nt{font-size:17.5px}
  .guide div{grid-template-columns:1fr 110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* CFP */
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.slot h4{margin:0;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.seedrow{display:grid;grid-template-columns:22px auto 1fr;gap:8px;align-items:center;font-weight:600;font-size:14.5px}
.seedrow .logo{--sz:28px}
.seedrow i{font:700 16px/1 var(--display);font-style:normal;color:var(--accent)}
.seedrow small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.2}
.vs{font:600 11px/1 var(--display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-left:30px}
td.pctcell{position:relative;min-width:74px}
td.pctcell em{position:absolute;left:6px;right:6px;bottom:4px;height:3px;background:rgba(244,236,217,.1);border-radius:2px;overflow:hidden}
td.pctcell em b{display:block;height:100%;background:var(--accent)}
tr.open td{background:var(--panel-2)}
.cdetail{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cdetail h4{margin:0 0 8px;font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hist{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:84px}
.hist div{background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.histx{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:760px){.bracket{grid-template-columns:1fr 1fr}.cdetail{grid-template-columns:1fr}}
#cdet h3 .logo{--sz:34px}
</style>
</head>
<body>
<div class="wrap">
<nav class="tabs" id="tabs" aria-label="Conference"></nav>
<div id="view"><p class="loading">Loading ChampCalc…</p></div>
<footer id="foot"></footer>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
