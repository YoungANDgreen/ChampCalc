name: Scheduled rebuild
# Pushes a timestamp commit so Vercel redeploys and the build pulls fresh ESPN data.
on:
  schedule:
    - cron: "17 11 * 8-12,1 *"   # every morning in season: picks up weeknight games and late or rescheduled finishes
    - cron: "23 5 * 8-12,1 3"    # Wednesdays, right after Tuesday night CFP rankings
    - cron: "47 19 * 8-12,1 0"   # Sunday afternoon: second pass for games that ended after the morning build
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/last-refresh.txt
          git config user.name "champcalc-bot"
          git config user.email "champcalc-bot@users.noreply.github.com"
          git add build/last-refresh.txt
          git commit -m "Scheduled data refresh"
          git push
