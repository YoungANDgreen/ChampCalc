name: Scheduled rebuild
# Pushes a timestamp commit so Vercel redeploys and the build pulls fresh ESPN data.
on:
  schedule:
    - cron: "17 11 * 8-12,1 0"   # Sundays, after Saturday's games
    - cron: "23 5 * 8-12,1 3"    # Wednesdays, after Tuesday night CFP rankings
    - cron: "41 8 * 8-12,1 6"    # Saturdays, to pick up weeknight games
  workflow_dispatch:
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > build/last-refresh.txt
          git config user.name "champcalc-bot"
          git config user.email "champcalc-bot@users.noreply.github.com"
          git add build/last-refresh.txt
          git commit -m "Scheduled data refresh"
          git push
